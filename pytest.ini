[pytest]
# A suíte do projeto vive em tests/.
#
# norecursedirs: worktrees git criadas DENTRO da raiz (wt-*/ e .claude/worktrees/)
# carregam uma cópia inteira de tests/. Sem esta linha, o pytest coleta os dois
# conjuntos, colide nos basenames ("import file mismatch") e a suíte nem chega a
# rodar — `python3 -m pytest -q` (o comando do CLAUDE.md) falha com ~162 erros de
# coleta enquanto existir uma worktree aqui.
#
# A lista repete os defaults do pytest (.* build dist CVS _darcs {arch} *.egg
# venv node_modules) porque definir norecursedirs SUBSTITUI o default, não soma.
norecursedirs = .* build dist CVS _darcs {arch} *.egg venv node_modules wt-*

# docs/db/TAREFA_ESTABILIDADE_SUITE.md, entrega (a): em 09/09 uma bateria de E2E ficou 12h
# pendurada (pytest vivo, Chromium vivo, main.py vivo, CPU zerada) — não existia teto nenhum.
# Isto não resolve a CAUSA (a família de flakes de LP-16/LP-21/LP-22 segue em medição); resolve
# a DESCOBERTA: transforma um travamento silencioso numa falha com stack trace de toda thread
# (pytest-timeout, método 'signal'/SIGALRM — funciona mesmo com o processo bloqueado num
# syscall, que é exatamente o quadro medido). 300s é folgado de propósito: o E2E mais pesado
# medido isolado (test_e2e_browser_conciliacao_final.py) leva ~13s; sob carga da suíte inteira
# já se mediu chamada de rede estourando o teto de 5s do cliente HTTP — o teto global tem que
# sobrar espaço pra isso sem virar falso positivo. Sobrescreva por execução com `--timeout=N`
# ou a variável de ambiente `PYTEST_TIMEOUT` (lida nativamente pelo plugin) quando a bancada
# for mais lenta que isto — não mexa neste número "por via das dúvidas".
timeout = 300
